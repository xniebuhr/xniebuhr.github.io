<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Page Not Found | Xander Niebuhr</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --bg-base: #121212;
        --accent: #09bd9c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        padding: 1.5rem;
        font-family: Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #e8e8e8;
        background-color: var(--bg-base);
        background-image:
          radial-gradient(ellipse 90% 55% at 85% -5%, rgba(9, 189, 156, 0.12), transparent 52%),
          radial-gradient(ellipse 70% 45% at 5% 105%, rgba(9, 189, 156, 0.07), transparent 48%),
          radial-gradient(ellipse 60% 45% at 50% 50%, rgba(9, 189, 156, 0.035), transparent 65%);
        overflow: hidden;
      }

      main {
        max-width: 34rem;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New',
          monospace;
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
      }

      h1 {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New',
          monospace;
        font-weight: 700;
        font-size: clamp(4rem, 16vw, 8rem);
        line-height: 1;
        letter-spacing: -0.02em;
        color: #fff;
        white-space: nowrap;
      }

      p.message {
        margin: 1.5rem auto 2.25rem;
        max-width: 28rem;
        font-size: 1.05rem;
        line-height: 1.6;
        color: #a3a3a3;
      }

      .home-link {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.05);
        color: #e8e8e8;
        padding: 0.65rem 1.5rem;
        border-radius: 999px;
        font-size: 0.95rem;
        text-decoration: none;
        transition:
          border-color 0.2s,
          background 0.2s,
          color 0.2s;
      }

      .home-link:hover {
        border-color: rgba(9, 189, 156, 0.4);
        background: rgba(9, 189, 156, 0.1);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Error 404</p>
      <h1>404</h1>
      <p class="message">This page doesn't exist — it either moved, never existed, or you followed a broken link.</p>
      <a class="home-link" href="/">← Back to the homepage</a>
    </main>
  </body>
</html>
